set-option -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g detach-on-destroy off      # don't exit from tmux when closing a session
# Send the active pane's directory (OSC 7) to the outer terminal along with
# the title, so Ghostty and Portal's Emacs follow the focused pane.
set -g set-titles on
# tmux 3.8 knows Ghostty supports OSC 7; earlier versions need telling.
set -as terminal-features ',xterm-ghostty:osc7'

set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# theme
# set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Show zoom/bell/activity icons on tabs, but not the noisy current/last markers.
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_last ""
set -g @catppuccin_date_time_text " %H:%M"
# Modules expand at draw time, so these can be set before tpm loads the theme.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

# resume
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'sainnhe/tmux-fzf'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='#{m:#{pane_current_command},^(?:g?(?:view|l?n?vim?x?)|fzf)(?:diff)?$}'
bind-key -n 'C-h' if-shell -F "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell -F "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell -F "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell -F "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# vim-style visual selection in copy mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'Escape' send-keys -X clear-selection

# Session picker, replacing the built-in choose-tree on prefix s. Each row is
# the session, a tab and its active window's name (a flow task's title), so
# the name is searchable too; the tab onwards is cut off before connecting.
bind-key s display-popup -E -w 40% "sel=\"$(
  sesh list -i --format '{name}\t{active_window_name}' |
    gum filter --limit 1 --placeholder 'Pick a sesh' --prompt='⚡'
)\" && sesh connect \"\${sel%%\t*}\""
# Overrides the default prefix L, which breaks with detach-on-destroy off.
bind -N "last-session (via sesh)" L run-shell "sesh last"

bind | split-window -h -f

# Platform-specific config (macos/, linux/ or omarchy/ provides ~/.config/tmux/platform.conf).
# Sets default-shell and the copy-mode 'y' clipboard binding.
source-file -q ~/.config/tmux/platform.conf

# Auto-install tpm on first run so plugins can bootstrap themselves.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
