# Cross-platform CLI tools + runtimes, managed by mise.
# Stowed to ~/.config/mise/config.toml and installed by setup.sh (`mise install`).
# Platform-bound things (GUI apps, the shell + its plugins, system tools) live in
# macos/Brewfile and linux/bootstrap.sh instead.

[tools]
# runtimes
node = "26.9.0"
python = "latest"
bun = "latest"          # upgrade with `mise upgrade bun`, not `bun upgrade`

# cli tools
cmake = "latest"          # native C/Swift project configuration
ninja = "latest"          # executes CMake-generated builds
biome = "latest"
fd = "latest"
eza = "latest"
zoxide = "latest"
direnv = "latest"
carapace = "latest"
neovim = "latest"
tree-sitter = "latest"   # treesitter CLI; required by nvim-treesitter (main branch)
ripgrep = "latest"
lazygit = "latest"
hunk = "latest"
bat = "latest"
bat-extras = "latest"
bottom = "latest"
fzf = "latest"
gum = "latest"
gh = "latest"
tokei = "latest"           # code statistics (lines of code by language)
awscli = "latest"
herdr = "latest"           # agent multiplexer (herdr.dev)
"github:joshmedeski/sesh" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:pi-acp" = "latest"                          # ACP adapter (bridges pi <-> agent-shell/Zed)
"cargo:raine/workmux" = "latest"

# language servers (editor-agnostic; used by eglot etc.)
# Eglot uses TypeScript's native `tsc --lsp`; keep tsls for other clients.
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest" # JSON/JSONC (also HTML/CSS/ESLint)
pnpm = "12.5.1"
codex = "latest"
